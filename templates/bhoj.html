<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP Bhoj University</title>

    <link rel="stylesheet" href="bhoj.css">
</head>

<body>

    <main class="bhoj-page">

        <header class="bhoj-header">
            <div>
                <span>Student Workspace</span>
                <h1>MP Bhoj University</h1>
                <p>Student tools and workflows in one place.</p>
            </div>

            <a href="../index.html" class="back-btn">
                ← Dashboard
            </a>
        </header>

        <section class="bhoj-content">

            <div class="welcome-card">
                <div class="welcome-icon">
                    🎓
                </div>

                <div>
                    <span>MP Bhoj Workspace</span>
                    <h2>Student Tools</h2>
                    <p>
                        Access student-related tools, information and workflows.
                    </p>
                </div>
            </div>

            <div class="tools-section">

                <div class="section-heading">
                    <span>Quick Access</span>
                    <h2>University Tools</h2>
                </div>

                <div class="tools-grid">

                    <button class="tool-card">
                        <div class="tool-icon">🔎</div>
                        <div>
                            <h3>Student Lookup</h3>
                            <p>Search student information</p>
                        </div>
                    </button>

                    <button class="tool-card">
                        <div class="tool-icon">📱</div>
                        <div>
                            <h3>Fetch Mobile Number</h3>
                            <p>Find mobile using roll number</p>
                        </div>
                    </button>

                    <button class="tool-card">
                        <div class="tool-icon">📄</div>
                        <div>
                            <h3>Result</h3>
                            <p>Access student results</p>
                        </div>
                    </button>

                    <button class="tool-card">
                        <div class="tool-icon">🎫</div>
                        <div>
                            <h3>Admit Card</h3>
                            <p>Access admit card tools</p>
                        </div>
                    </button>

                    <button class="tool-card">
                        <div class="tool-icon">🆔</div>
                        <div>
                            <h3>Enrollment</h3>
                            <p>Check enrollment details</p>
                        </div>
                    </button>

                    <button class="tool-card">
                        <div class="tool-icon">📚</div>
                        <div>
                            <h3>Subject Details</h3>
                            <p>View subject information</p>
                        </div>
                    </button>

                </div>

            </div>

        </section>

    </main>

    <script src="bhoj.js"></script>

</body>
</html>
